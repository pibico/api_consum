# CONSUM-IA landing + server side — consum.pibico.es → api_consum (:8183)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name consum.pibico.es;

    ssl_certificate     /etc/letsencrypt/live/consum.pibico.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/consum.pibico.es/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8183;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name consum.pibico.es;
    return 301 https://$server_name$request_uri;
}
